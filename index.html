<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOOKLIE Студия</title>
<link rel="icon" href="character/looklie-boy.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f7f4; --panel:#ffffff; --ink:#16181d; --muted:#6c7280; --line:#e6e6e0; --soft:#f0f0ea;
  --accent:#ffd21f; --accent-ink:#2b2200; --ok:#1f9d63; --bad:#d9423f; --busy:#3b82f6;
  --code:#14161b; --code-ink:#cfd3dc;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#111317;--panel:#1a1d23;--ink:#eceef2;--muted:#8d94a3;--line:#292d36;--soft:#222630;--code:#0d0f13}
}
:root[data-theme="dark"]{--bg:#111317;--panel:#1a1d23;--ink:#eceef2;--muted:#8d94a3;--line:#292d36;--soft:#222630;--code:#0d0f13}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);background:var(--bg);font:400 15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit}

.top{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:3;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;letter-spacing:-.2px}
.logo img{width:34px;height:34px;border-radius:10px;object-fit:cover;object-position:50% 12%;background:#d8ecff}
.logo span{color:var(--muted);font-weight:400}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--bg);min-width:0}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none}
.pill.on i{background:var(--ok)}
.spacer{flex:1}
.modelsel{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.modelsel select{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer;max-width:260px}
.st{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.cost{font:400 12px "JetBrains Mono",monospace;color:var(--muted);white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.97)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--busy);outline-offset:2px}

main{max-width:1320px;margin:0 auto;padding:20px 16px 80px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.side{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;padding-bottom:4px}
.colhead{display:flex;align-items:center;gap:12px;padding:0 4px 12px;color:var(--muted);font-size:14px;min-height:30px;flex-wrap:wrap}
.colhead h2{margin:0;font-size:15px;font-weight:600;color:var(--ink)}
.ready{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;cursor:pointer;padding:0;text-align:left;display:flex;flex-direction:column}
.card:hover{border-color:var(--muted)}
.card .pv{width:100%;aspect-ratio:9/16;object-fit:cover;background:var(--soft);display:grid;place-items:center;font-size:30px;border-bottom:1px solid var(--line)}
.card .meta{padding:8px 10px 10px;display:grid;gap:2px;min-width:0}
.card .tt{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{font:400 11px "JetBrains Mono",monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{border:1px dashed var(--line);border-radius:14px;padding:36px 20px;text-align:center;color:var(--muted);font-size:14px}
dialog#card{border:0;padding:0;border-radius:18px;background:var(--panel);color:var(--ink);width:min(880px,94vw);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog#card::backdrop{background:rgba(10,12,16,.55)}
.mc{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;padding:20px}
.mc video,.mc .noVideo{width:100%;aspect-ratio:9/16;border-radius:12px;background:#000;display:block}
.mc .noVideo{background:transparent}
.mc .info{display:grid;gap:12px;align-content:start;min-width:0}
.mc h3{margin:0;font-size:18px;font-weight:600;padding-right:36px}
.mc .facts{display:flex;flex-wrap:wrap;gap:6px}
.mc details summary{cursor:pointer;color:var(--muted);font-size:13px}
.mc details .prompt{margin-top:8px}
.vers{display:grid;gap:6px}
.ver{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 10px;font-size:13px;cursor:pointer}
.ver:hover{background:var(--soft)}
.ver.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ver[disabled]{cursor:default;background:var(--soft)}
.ver b{font-weight:600}
.ver small{font:400 11px "JetBrains Mono",monospace;color:var(--muted);white-space:nowrap}
.ver .err-note{grid-column:1 / -1}
.card .badges{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap}
.card{position:relative}
.card .badges .chip{background:rgba(255,255,255,.92);color:#16181d;font-size:11px;padding:3px 8px}
.card .badges .chip.busy{background:rgba(59,130,246,.92);color:#fff}
.regen{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.regen h4{margin:0;font-size:14px;font-weight:600}
.regen select{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;width:100%}
.regen textarea{width:100%;min-height:150px;resize:vertical;border-radius:10px;border:1px solid var(--line);background:var(--code);color:var(--code-ink);padding:10px 12px;font:400 12px/1.6 "JetBrains Mono",ui-monospace,Consolas,monospace}
.regen textarea:focus{outline:2px solid var(--busy);outline-offset:1px}
.x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px;line-height:1}
.bar{display:flex;align-items:center;gap:12px;padding:0 4px 12px;color:var(--muted);font-size:14px}
.bar label{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink);font-weight:500}
.list{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.row{border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.line{display:grid;grid-template-columns:24px 28px 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.line:hover{background:var(--soft)}
input[type=checkbox]{width:18px;height:18px;accent-color:#16181d;cursor:pointer;margin:0}
.em{font-size:22px;text-align:center}
.tt{font-weight:500;line-height:1.25}
.words{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.ok{background:rgba(31,157,99,.14);color:var(--ok)}
.chip.busy{background:rgba(59,130,246,.14);color:var(--busy)}
.chip.err{background:rgba(217,66,63,.14);color:var(--bad)}
.chip.appr{background:rgba(255,210,31,.35);color:#6b5400}
.thumb{width:56px;height:84px;border-radius:8px;background:var(--soft);border:1px solid var(--line);object-fit:cover;display:grid;place-items:center;color:var(--muted);font-size:11px;overflow:hidden}
video.thumb{display:block}
.more{padding:4px 14px 16px 66px;display:grid;gap:12px}
.shots{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.shot{display:grid;grid-template-columns:54px 1fr 130px;gap:8px;align-items:center;padding:4px 8px;border-bottom:1px solid var(--line)}
.shot:last-child{border-bottom:0}
.tm{color:var(--muted);font:400 12px "JetBrains Mono",monospace}
input[type=text]{width:100%;font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink)}
input[type=text]:hover{border-color:var(--line)}
input[type=text]:focus{border-color:var(--busy);background:var(--bg);outline:0}
input.say{font-weight:600}
.prompt{border-radius:10px;background:var(--code);color:var(--code-ink);padding:12px 14px;font:400 12px/1.6 "JetBrains Mono",ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto}
.big{width:100%;aspect-ratio:9/16;max-height:420px;border-radius:12px;background:#000;display:block}
.noVideo{width:100%;aspect-ratio:9/16;max-height:420px;border-radius:12px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:12px}
.err-note{font:400 12px "JetBrains Mono",monospace;color:var(--bad);word-break:break-word}
.file{font:400 12px "JetBrains Mono",monospace;color:var(--muted);word-break:break-all}
.none{padding:36px 20px;text-align:center;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;display:none;max-width:90vw;z-index:5;text-align:center}
#toast.on{display:block}

@media(max-width:720px){
  .top{padding:10px 14px}
  .spacer{display:none}
  .pill{order:5;width:100%}
  .line{grid-template-columns:22px 24px 1fr;gap:10px}
  .line .st{grid-column:3;grid-row:2;flex-direction:row;align-items:center;gap:8px}
  .modelsel{order:4;width:100%}
  .modelsel select{flex:1;max-width:none}
  .more{padding:4px 14px 16px}
  .shot{grid-template-columns:1fr;gap:2px}
  .ready{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mc{grid-template-columns:1fr;padding:16px}
  .mc video,.mc .noVideo{max-height:62vh;width:auto;margin:0 auto}
}
@media(max-width:960px){
  .split{grid-template-columns:1fr}
  .side{position:static;max-height:none;overflow:visible}
}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><img src="character/looklie-boy.png" alt="LOOKLIE">LOOKLIE <span>Студия</span></div>
  <span class="pill" id="helper"><i></i><span id="helperText">Проверяю помощника…</span></span>
  <label class="modelsel">Модель <select id="model" aria-label="Модель генерации"></select></label>
  <span class="spacer"></span>
  <button class="btn" id="askNew">✨ Сгенерировать идеи</button>
  <button class="btn primary" id="gen">Генерировать</button>
</header>
<main class="split">
  <section aria-labelledby="hTodo">
    <div class="colhead"><h2 id="hTodo">Сценарии</h2><label style="display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink)"><input type="checkbox" id="all"> Выбрать все</label><span id="count"></span></div>
    <div class="list" id="list"></div>
  </section>
  <section class="side" aria-labelledby="hReady">
    <div class="colhead"><h2 id="hReady">Готовые</h2><span id="readyCount"></span></div>
    <div id="ready"></div>
  </section>
</main>
<dialog id="card" aria-labelledby="cardTitle"><div id="cardBody" style="position:relative"></div></dialog>
<div id="toast" role="status"></div>

<script src="generator.js"></script>
<script>
const CHAR_START = 'Same super cute toddler boy with big round clear light glasses, huge bright blue sparkling eyes, soft rosy cheeks, tiny freckles, light golden-blond hair in a modern memorable hairstyle (fluffy textured top with a playful upward swoosh quiff, short neat sides), warm biggest smile, tiny body, wearing a cozy sunny-yellow hoodie with the text "LOOKLIE" clearly visible on the chest, light blue rolled-up jeans, small white sneakers';
const CHAR_END = '. Only him. Strictly same look. Very sticky adorable face that kids can\'t stop watching.';
const EMOJI = { 'skate-learn':'🛹', buildings:'🏙️', 'farm-animals':'🐮', colors:'🎈', fruits:'🍎', vehicles:'🚂', weather:'☀️' };
const FALLBACK_EMOJI = ['🌟','🚀','🧩','🌈','🦄','🎨','🍄','🔢','🐻','🌳'];
const JOB_TEXT = { waiting:'Ждёт очереди', submitting:'Отправка…', queued:'В очереди Higgsfield', generating:'Генерируется…' };
const HELPER = new URLSearchParams(location.search).get('helper') || 'http://localhost:8787';
const DEFAULT_MODEL = 'grok_video_v15_lite';
// до подключения помощника показываем названия без цен; цены приходят от hf (generate cost)
const FALLBACK_MODELS = [['grok_video_v15_lite','Grok Imagine 1.5 Lite'],['wan3_0','Wan 3.0'],['kling3_0','Kling 3.0'],['kling4_0','Kling 4.0'],['happy_horse_video','Happy Horse'],['seedance_2_0','Seedance 2.0'],['seedance_2_5','Seedance 2.5']].map(([id,name]) => ({ id, name, credits: null }));

let helperOn = false, jobs = {}, vers = {}, base = [], fileScenarios = [];   // jobs: id версии -> задание; vers: сценарий -> его версии
let cardId = null, cardVer = null;   // открытая карточка и выбранная в ней версия
let custom = load('lk_custom', []);
let state = load('lk_state', {});       // id -> {checked, shots}
let models = FALLBACK_MODELS, balance = null, modelsAt = 0;
let modelId = load('lk_model', DEFAULT_MODEL);
let open = new Set();
let lastSig = '';

function load(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function hash(t){ let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) | 0; return h; }
function emojiFor(s){ return s.emoji || EMOJI[s.id] || FALLBACK_EMOJI[Math.abs(hash(s.id)) % FALLBACK_EMOJI.length]; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function fmt(c){ return c == null ? '—' : (Math.round(c * 10) / 10) + ' кр.'; }
function modelOf(id){ return models.find(m => m.id === id) || FALLBACK_MODELS.find(m => m.id === id) || models[0]; }
function price(){ const m = modelOf(modelId); return m ? m.credits : null; }
function rowCost(s){
  const j = s.job;
  if (j && j.status !== 'failed' && j.credits != null) return (j.modelName ? j.modelName + ' · ' : '') + fmt(j.credits);
  if (s.done) return j && j.modelName ? j.modelName : '';
  return selectable(s) ? fmt(price()) : '';
}
function renderModels(){
  const sel = document.getElementById('model');
  if (!models.some(m => m.id === modelId)) modelId = DEFAULT_MODEL;
  sel.innerHTML = models.map(m => '<option value="' + m.id + '"' + (m.id === modelId ? ' selected' : '') + '>' + esc(m.name) + (m.ref ? ' + паспорт' : '') + (m.credits != null ? ' · ' + fmt(m.credits) : '') + '</option>').join('');
}
async function loadModels(){
  if (Date.now() - modelsAt < 5 * 60 * 1000) return;
  modelsAt = Date.now();
  try {
    const d = await (await fetch(HELPER + '/models')).json();
    if (Array.isArray(d.models) && d.models.length){ models = d.models; balance = d.balance; renderModels(); render(true); }
  } catch { modelsAt = 0; }
}
function view(s){
  const o = state[s.id] || {};
  const all = vers[s.id] || [];
  const versions = all.filter(j => j.status === 'done').sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));   // свежие первыми
  const active = all.filter(j => !['done','failed'].includes(j.status));
  const failed = all.filter(j => j.status === 'failed');
  const job = active[0] || versions[0] || failed[failed.length - 1];
  const done = s.status === 'done' || versions.length > 0;
  const checked = !!(o.checked || o.status === 'approved');
  return { ...s, done, checked, job, versions, active, failed, shots: o.shots || s.shots };
}
function buildPrompt(s){
  const extra = s.extra ? ', ' + s.extra : '';
  const end = s.others ? CHAR_END.replace(' Only him.', '') : CHAR_END;
  const loc = s.others ? s.location + ' Also in the scene: ' + s.others + '.' : s.location;
  const lines = s.shots.map((x,i) => `${i*2}-${i*2+2}s: ${x.action}, says "${x.say}"`).join('\n');
  return [
    'Cute 3D Pixar-style toddler video, 10 seconds, bright colors, nursery style.',
    CHAR_START + extra + end,
    loc, s.intro, lines,
    `${s.rule} Slow cute clear movements. Soft child voice. Light soft background music throughout: a gentle cheerful lullaby-style kids melody with ukulele, soft xylophone and glockenspiel, quiet and calm, always lower than his voice. No text on screen (except "LOOKLIE" on his clothes). Very simple and toddler-safe.`
  ].join('\n\n');
}
function status(s){
  const j = s.job;
  if (j && j.status === 'failed' && !s.done) return ['Ошибка', 'err'];
  if (j && !['done','failed'].includes(j.status)) return [JOB_TEXT[j.status] || j.status, 'busy'];
  if (s.done) return ['Готово', 'ok'];
  if (s.checked) return ['Одобрено', 'appr'];
  return ['Идея', ''];
}
let toastTimer;
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2400); }
async function copy(text, msg){ try { await navigator.clipboard.writeText(text); toast(msg); } catch { prompt('Скопируйте вручную:', text); } }

function selectable(s){ return !s.done && !(s.job && !['failed','done'].includes(s.job.status)); }
function queueItems(){ return base.map(view).filter(s => s.checked && selectable(s)); }

function approvedCommand(items){
  return 'Сгенерируй видео по одобренным сценариям (' + modelOf(modelId).name + ', 9:16, 720p, 10 сек, без референса), по очереди, готовые файлы клади в папку «YouTuBe UP!» на рабочем столе: '
    + items.map(s => s.id).join(', ') + '\n\n```json\n' + JSON.stringify(items.map(s => ({ id: s.id, title: s.title, prompt: buildPrompt(s) })), null, 2) + '\n```';
}
async function generate(){
  askNotify();
  const items = queueItems();
  if (!items.length){ toast('Отметьте галочкой сценарии, которые нужно сгенерировать'); return; }
  if (!helperOn){ copy(approvedCommand(items), 'Помощник не запущен — команда скопирована, вставьте её Claude в чат'); return; }
  const p = price();
  const total = p != null ? ' Спишется ≈ ' + fmt(items.length * p) + (balance != null ? ' (на счёте ' + fmt(balance) + ').' : '.') : '';
  if (!confirm('Сгенерировать видео: ' + items.length + ' шт. моделью ' + modelOf(modelId).name + '?' + total + ' Ролики делаются по очереди.')) return;
  try {
    const r = await fetch(HELPER + '/generate', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ items: items.map(s => ({ id: s.id, title: s.title, prompt: buildPrompt(s), model: modelId })) }) });
    const d = await r.json();
    toast('Отправлено в очередь: ' + (d.added || []).length);
    modelsAt = 0; poll();
  } catch { toast('Не удалось связаться с помощником'); }
}

// ---------- оповещение о готовом ролике ----------
let prevStatus = null;   // id -> статус на прошлом опросе (null — первый опрос, о старых роликах не сообщаем)
function askNotify(){ try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch {} }
function chime(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1318.5].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i * 0.16;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.55);
    });
  } catch {}
}
function notifyDone(key){
  const j = jobs[key] || {};
  const sc = j.scenario || key;
  const s = base.find(b => b.id === sc);
  const title = (s ? s.title : sc) + (j.modelName ? ' · ' + j.modelName : '');
  toast('🎬 Ролик готов: ' + title);
  chime();
  try {
    if ('Notification' in window && Notification.permission === 'granted'){
      const n = new Notification('Ролик готов', { body: title, icon: 'character/looklie-boy.png', tag: 'done-' + key });
      n.onclick = () => { window.focus(); openCard(sc, key); n.close(); };
    }
  } catch {}
}
function checkFinished(){
  const now = {};
  Object.values(jobs).forEach(j => { now[j.id] = j.status; });
  if (prevStatus) Object.keys(now).forEach(id => { if (now[id] === 'done' && prevStatus[id] !== 'done') notifyDone(id); });
  prevStatus = now;
}

async function poll(){
  const pill = document.getElementById('helper'), txt = document.getElementById('helperText');
  try {
    const h = await (await fetch(HELPER + '/health')).json();
    helperOn = !!h.ok; pill.className = 'pill on'; txt.textContent = 'Помощник подключён · ' + h.outDir;
    const list = (await (await fetch(HELPER + '/jobs')).json()).jobs || [];
    jobs = {}; vers = {};
    list.forEach(j => { jobs[j.id] = j; const sc = j.scenario || j.id; (vers[sc] = vers[sc] || []).push(j); });
    checkFinished();
    loadModels();
  } catch {
    helperOn = false; jobs = {}; vers = {}; prevStatus = null; pill.className = 'pill'; txt.textContent = 'Помощник не запущен — запустите start-server.bat';
  }
  render();
}

function addIdeas(){
  const fresh = generateIdeas(10, base.map(b => b.id));
  if (!fresh.length){ toast('Банк идей закончился — все темы уже добавлены'); return; }
  custom = custom.concat(fresh); save('lk_custom', custom);
  base = fileScenarios.concat(custom);
  render(true);
  toast('Добавлено идей: ' + fresh.length);
}

function signature(items){
  return JSON.stringify([helperOn, modelId, models.map(m => m.credits), balance, [...open], items.map(s => [s.id, s.checked, s.done,
    (vers[s.id] || []).map(j => [j.id, j.status, j.error, j.model, j.credits, j.doneAt])])]);
}
function videoSrc(key){ return `${HELPER}/video/${encodeURIComponent(key)}.mp4`; }
function when(ms){ return ms ? new Date(ms).toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : ''; }
function doneAt(s){ return (s.versions[0] && s.versions[0].doneAt) || 0; }
function plural(n, one, few, many){ const a = n % 10, b = n % 100; return n + ' ' + (a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many); }
function verLine(j){ return [j.modelName || (j.model ? modelOf(j.model).name : ''), j.credits != null ? fmt(j.credits) : ''].filter(Boolean).join(' · '); }

function renderReady(items){
  const ready = items.filter(s => s.done).sort((a, b) => doneAt(b) - doneAt(a));   // свежие сверху
  document.getElementById('readyCount').textContent = ready.length ? ready.length + ' шт.' : '';
  document.getElementById('ready').innerHTML = ready.length ? '<div class="ready">' + ready.map(s => {
    const last = s.versions[0];
    const pv = helperOn ? `<video class="pv" src="${videoSrc(last ? last.id : s.id)}#t=0.1" preload="metadata" muted playsinline></video>` : `<div class="pv">${emojiFor(s)}</div>`;
    const meta = esc(last ? verLine(last) : '') + '</small><small>' + esc(when(doneAt(s)));
    const badges = (s.versions.length > 1 ? `<span class="chip">${plural(s.versions.length, 'версия', 'версии', 'версий')}</span>` : '')
      + (s.active.length ? `<span class="chip busy">Генерируется…</span>` : '');
    return `<button class="card" data-card="${s.id}" aria-label="Открыть: ${esc(s.title)}">${pv}${badges ? `<span class="badges">${badges}</span>` : ''}<span class="meta"><span class="tt">${emojiFor(s)} ${esc(s.title)}</span><small>${meta}</small></span></button>`;
  }).join('') + '</div>' : '<div class="empty">Готовые ролики появятся здесь</div>';
}

// ---------- карточка готового сценария: версии + перегенерация ----------
function cardScenario(){ return base.map(view).find(b => b.id === cardId); }
function verNumbers(s){ const m = {}; s.versions.slice().reverse().forEach((j, i) => { m[j.id] = i + 1; }); return m; }   // старейшая = версия 1
function renderCardVers(){
  const s = cardScenario(); const box = document.getElementById('cardVers');
  if (!s || !box) return;
  const num = verNumbers(s);
  const rows = s.active.map(j => `<button class="ver" disabled><b>Новая</b><span>${esc(verLine(j))}</span><span class="chip busy">${esc(JOB_TEXT[j.status] || j.status)}</span></button>`)
    .concat(s.versions.map(j => `<button class="ver${j.id === cardVer ? ' sel' : ''}" data-ver="${j.id}"><b>Версия ${num[j.id]}</b><span>${esc(verLine(j) || 'модель неизвестна')}</span><small>${esc(when(j.doneAt))}</small></button>`))
    .concat(s.failed.map(j => `<button class="ver" disabled><b>Ошибка</b><span>${esc(verLine(j))}</span><span class="chip err">не вышло</span><span class="err-note">${esc(j.error || '')}</span></button>`));
  box.innerHTML = rows.join('') || '<div class="file">Версий нет</div>';
}
function showVersion(key){
  const s = cardScenario(); if (!s) return;
  cardVer = key;
  const j = jobs[key] || {};
  document.getElementById('cardPlayer').innerHTML = helperOn
    ? `<video src="${videoSrc(key)}" controls autoplay playsinline></video>`
    : `<div class="noVideo">Помощник не запущен — запустите его, чтобы посмотреть видео</div>`;
  document.getElementById('cardPrompt').textContent = j.prompt || buildPrompt(s);
  document.getElementById('cardFile').textContent = j.file || s.file || '';
  renderCardVers();
}
function regenLabel(){
  const m = modelOf(document.getElementById('regenModel').value);
  document.getElementById('regenBtn').textContent = 'Перегенерировать' + (m && m.credits != null ? ' · ' + fmt(m.credits) : '');
}
function openCard(id, key){
  const s = base.map(view).find(b => b.id === id);
  if (!s) return;
  cardId = id;
  const ver = key || (s.versions[0] ? s.versions[0].id : id);
  const startPrompt = (jobs[ver] && jobs[ver].prompt) || buildPrompt(s);
  document.getElementById('cardBody').innerHTML = `<button class="x" data-close aria-label="Закрыть">×</button>
    <div class="mc"><div id="cardPlayer"></div><div class="info">
      <h3 id="cardTitle">${emojiFor(s)} ${esc(s.title)}</h3>
      <div class="vers" id="cardVers"></div>
      <details><summary>Промпт выбранной версии</summary><div class="prompt" id="cardPrompt"></div></details>
      <div class="regen">
        <h4>Перегенерировать</h4>
        <select id="regenModel" aria-label="Модель для перегенерации">${models.map(m => `<option value="${m.id}"${m.id === modelId ? ' selected' : ''}>${esc(m.name)}${m.ref ? ' + паспорт' : ''}${m.credits != null ? ' · ' + fmt(m.credits) : ''}</option>`).join('')}</select>
        <textarea id="regenPrompt" aria-label="Промпт для перегенерации" spellcheck="false">${esc(startPrompt)}</textarea>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="regenBtn">Перегенерировать</button><button class="btn" data-copy-text>Копировать промпт</button></div>
      </div>
      <div class="file" id="cardFile"></div>
    </div></div>`;
  regenLabel();
  showVersion(ver);
  const d = document.getElementById('card');
  if (!d.open) d.showModal();
}
async function regenerate(){
  const s = cardScenario(); if (!s) return;
  if (!helperOn){ toast('Помощник не запущен — запустите start-server.bat'); return; }
  const model = document.getElementById('regenModel').value, prompt = document.getElementById('regenPrompt').value.trim();
  if (!prompt){ toast('Промпт пустой'); return; }
  const m = modelOf(model);
  if (!confirm('Перегенерировать «' + s.title + '» моделью ' + m.name + '?' + (m.credits != null ? ' Спишется ≈ ' + fmt(m.credits) + '.' : '') + ' Старые версии сохранятся.')) return;
  askNotify();
  try {
    const r = await fetch(HELPER + '/generate', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ items: [{ id: s.id, title: s.title, prompt, model, regen: true }] }) });
    const d = await r.json();
    toast((d.added || []).length ? 'Новая версия поставлена в очередь' : 'Не удалось поставить в очередь');
    modelsAt = 0; await poll(); renderCardVers();
  } catch { toast('Не удалось связаться с помощником'); }
}
function closeCard(){ const d = document.getElementById('card'); const v = d.querySelector('video'); if (v) v.pause(); if (d.open) d.close(); cardId = null; cardVer = null; }
function render(force){
  const items = base.map(view);
  const sig = signature(items);
  if (!force && sig === lastSig) return;
  lastSig = sig;
  const sel = items.filter(selectable);
  const all = document.getElementById('all');
  all.checked = sel.length > 0 && sel.every(s => s.checked);
  all.disabled = !sel.length;
  const nSel = queueItems().length, p = price();
  document.getElementById('count').textContent = 'Выбрано: ' + nSel + ' из ' + items.filter(s => !s.done).length
    + (nSel && p != null ? ' · ≈ ' + fmt(nSel * p) : '') + (balance != null ? ' · на счёте ' + fmt(balance) : '');
  document.getElementById('gen').disabled = !queueItems().length;
  const ae = document.activeElement; const keep = ae && ae.dataset ? { id: ae.dataset.id, i: ae.dataset.i, k: ae.dataset.k } : null;

  const todo = items.filter(s => !s.done);
  document.getElementById('list').innerHTML = todo.length ? todo.map(s => {
    const [t, cls] = status(s);
    const editable = selectable(s);
    const shots = s.shots.map((x,i) => editable
      ? `<div class="shot"><span class="tm">${i*2}–${i*2+2} с</span><input type="text" value="${esc(x.action)}" aria-label="Действие, кадр ${i+1}" data-id="${s.id}" data-i="${i}" data-k="action"><input class="say" type="text" value="${esc(x.say)}" aria-label="Слово, кадр ${i+1}" data-id="${s.id}" data-i="${i}" data-k="say"></div>`
      : `<div class="shot"><span class="tm">${i*2}–${i*2+2} с</span><span>${esc(x.action)}</span><b>${esc(x.say)}</b></div>`).join('');
    const err = (s.job && s.job.status === 'failed') ? `<div class="err-note">${esc(s.job.error || '')}</div>` : '';
    const more = open.has(s.id) ? `<div class="more"><div class="words" style="white-space:normal">${esc(s.location)}</div><div class="shots">${shots}</div><div class="prompt" data-prompt="${s.id}">${esc(buildPrompt(s))}</div><div><button class="btn small" data-copy="${s.id}">Копировать промпт</button></div>${err}</div>` : '';
    return `<div class="row"><div class="line" data-open="${s.id}">
      <input type="checkbox" data-check="${s.id}" ${s.checked ? 'checked' : ''} ${selectable(s) ? '' : 'disabled'} aria-label="Одобрить: ${esc(s.title)}">
      <span class="em">${emojiFor(s)}</span>
      <div style="min-width:0"><div class="tt">${esc(s.title)}</div><div class="words">${esc(s.shots.map(x => x.say).join(' · '))}</div></div>
      <span class="st"><span class="chip ${cls}">${esc(t)}</span>${rowCost(s) ? `<small class="cost">${esc(rowCost(s))}</small>` : ''}</span></div>${more}</div>`;
  }).join('') : '<div class="none">Все сценарии сгенерированы — нажмите «Сгенерировать идеи».</div>';
  renderReady(items);
  if (cardId) renderCardVers();   // в открытой карточке обновляем только список версий — видео и форма не трогаются

  if (keep && keep.id){ const el = document.querySelector(`[data-id="${keep.id}"][data-i="${keep.i}"][data-k="${keep.k}"]`); if (el) el.focus(); }
}

function setChecked(id, v){ state[id] = { ...(state[id]||{}), checked: v, status: undefined }; save('lk_state', state); render(); }
document.addEventListener('click', e => {
  const cb = e.target.closest('[data-check]');
  if (cb){ e.stopPropagation(); return; }                       // чекбокс обрабатывает change
  const cp = e.target.closest('[data-copy]');
  if (cp){ copy(buildPrompt(view(base.find(b => b.id === cp.dataset.copy))), 'Промпт скопирован'); return; }
  if (e.target.closest('[data-close]')) return closeCard();
  if (e.target.id === 'card') return closeCard();                // клик по затемнению вокруг карточки
  const cd = e.target.closest('[data-card]');
  if (cd) return openCard(cd.dataset.card);
  const vb = e.target.closest('[data-ver]');
  if (vb) return showVersion(vb.dataset.ver);
  if (e.target.closest('#regenBtn')) return regenerate();
  if (e.target.closest('[data-copy-text]')) return copy(document.getElementById('regenPrompt').value, 'Промпт скопирован');
  if (e.target.closest('#gen')) return generate();
  if (e.target.closest('#askNew')) return addIdeas();
  if (e.target.closest('input,video,textarea')) return;
  const ln = e.target.closest('[data-open]');
  if (ln){ const id = ln.dataset.open; open.has(id) ? open.delete(id) : open.add(id); render(true); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'model'){ modelId = t.value; save('lk_model', modelId); render(true); return; }
  if (t.id === 'regenModel') return regenLabel();
  if (t.dataset && t.dataset.check) setChecked(t.dataset.check, t.checked);
  if (t.id === 'all'){ base.map(view).filter(selectable).forEach(s => { state[s.id] = { ...(state[s.id]||{}), checked: t.checked, status: undefined }; }); save('lk_state', state); render(true); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (!(t.dataset && t.dataset.k)) return;
  const s = view(base.find(b => b.id === t.dataset.id));
  const shots = s.shots.map(x => ({...x}));
  shots[+t.dataset.i][t.dataset.k] = t.value;
  state[s.id] = { ...(state[s.id]||{}), shots }; save('lk_state', state);
  const p = document.querySelector(`[data-prompt="${s.id}"]`);
  if (p) p.textContent = buildPrompt({ ...s, shots });
});

document.getElementById('card').addEventListener('close', () => { const v = document.querySelector('#card video'); if (v) v.pause(); cardId = null; cardVer = null; });
renderModels();
fetch('scenarios.json?v=' + Date.now()).then(r => r.json()).then(d => {
  fileScenarios = d; base = fileScenarios.concat(custom); render(true); poll(); setInterval(poll, 6000);
}).catch(() => { document.getElementById('list').innerHTML = '<div class="none">Не удалось загрузить scenarios.json. Откройте сайт через GitHub Pages или локальный сервер.</div>'; });
</script>
</body>
</html>
