<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOOKLIE Студия</title>
<link rel="icon" href="character/looklie-boy.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f7f4; --panel:#ffffff; --ink:#16181d; --muted:#6c7280; --line:#e6e6e0; --soft:#f0f0ea;
  --accent:#ffd21f; --accent-ink:#2b2200; --ok:#1f9d63; --bad:#d9423f; --busy:#3b82f6;
  --code:#14161b; --code-ink:#cfd3dc;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#111317;--panel:#1a1d23;--ink:#eceef2;--muted:#8d94a3;--line:#292d36;--soft:#222630;--code:#0d0f13}
}
:root[data-theme="dark"]{--bg:#111317;--panel:#1a1d23;--ink:#eceef2;--muted:#8d94a3;--line:#292d36;--soft:#222630;--code:#0d0f13}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);background:var(--bg);font:400 15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:3}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;letter-spacing:-.2px}
.logo img{width:34px;height:34px;border-radius:10px;object-fit:cover;object-position:50% 12%;background:#d8ecff}
.logo span{color:var(--muted);font-weight:400}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--bg)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none}
.pill.on i{background:var(--ok)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.97)}
.btn.ghost{background:transparent}
.btn.ok{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--busy);outline-offset:2px}

/* layout */
.app{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 59px)}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;gap:2px;padding:12px 12px 0;border-bottom:1px solid var(--line)}
.tab{flex:1;border:0;background:transparent;padding:8px 4px 10px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab b{font-weight:500;margin-left:4px;color:var(--muted)}
.list{overflow:auto;flex:1}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 16px;cursor:pointer}
.item:hover{background:var(--soft)}
.item[aria-current="true"]{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
.item .em{font-size:20px;width:30px;text-align:center;flex:none}
.item .tx{min-width:0;flex:1}
.item .tt{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .st{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .st.busy{color:var(--busy)} .item .st.err{color:var(--bad)} .item .st.good{color:var(--ok)}
.none{padding:32px 20px;color:var(--muted);font-size:14px;text-align:center}

main{padding:28px 32px 80px;min-width:0;max-width:860px}
.head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.head .em{font-size:34px}
.head h1{font-size:24px;line-height:1.2;margin:0;font-weight:600;letter-spacing:-.4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 22px}
.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:22px 0 8px;font-weight:500}
.shots{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.shot{display:grid;grid-template-columns:64px 1fr 170px;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.shot:last-child{border-bottom:0}
.shot .tm{color:var(--muted);font:400 12px "JetBrains Mono",monospace}
input[type=text]{width:100%;font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink)}
input[type=text]:hover{border-color:var(--line)}
input[type=text]:focus{border-color:var(--busy);background:var(--bg);outline:0}
input.say{font-weight:600}
.ro{font-size:14px}
.ro.say{font-weight:600}
.prompt{border-radius:14px;background:var(--code);color:var(--code-ink);padding:16px;font:400 12.5px/1.65 "JetBrains Mono",ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.note{margin-top:14px;font-size:13px;color:var(--muted)}
.note.err{color:var(--bad);font-family:"JetBrains Mono",monospace;font-size:12px;word-break:break-word}
.empty{display:grid;place-items:center;min-height:50vh;color:var(--muted);text-align:center}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;display:none;max-width:90vw;z-index:5;text-align:center}
#toast.on{display:block}

@media(max-width:820px){
  .app{grid-template-columns:1fr}
  aside{border-right:0;border-bottom:1px solid var(--line)}
  .list{max-height:300px}
  main{padding:20px 16px 80px}
  .shot{grid-template-columns:1fr;gap:2px}
  .top{flex-wrap:wrap;padding:10px 14px}
  .spacer{display:none}
  .pill{order:5;width:100%}
}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><img src="character/looklie-boy.png" alt="LOOKLIE">LOOKLIE <span>Студия</span></div>
  <span class="pill" id="helper"><i></i><span id="helperText">Проверяю помощника…</span></span>
  <span class="spacer"></span>
  <button class="btn" id="askNew">✨ Сгенерировать идеи</button>
  <button class="btn primary" id="copyCmd">Сгенерировать видео</button>
</header>
<div class="app">
  <aside>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="list" id="list"></div>
  </aside>
  <main id="detail"></main>
</div>
<div id="toast" role="status"></div>

<script src="generator.js"></script>
<script>
const CHAR_START = 'Same super cute toddler boy with big round clear light glasses, huge bright blue sparkling eyes, soft rosy cheeks, tiny freckles, light golden-blond hair in a modern memorable hairstyle (fluffy textured top with a playful upward swoosh quiff, short neat sides), warm biggest smile, tiny body, wearing a cozy sunny-yellow hoodie with the text "LOOKLIE" clearly visible on the chest, light blue rolled-up jeans, small white sneakers';
const CHAR_END = '. Only him. Strictly same look. Very sticky adorable face that kids can\'t stop watching.';
const TABS = [['proposed','Новые'], ['approved','Одобрено'], ['done','Готово'], ['rejected','Корзина']];
const EMOJI = { 'skate-learn':'🛹', buildings:'🏙️', 'farm-animals':'🐮', colors:'🎈', fruits:'🍎', vehicles:'🚂', weather:'☀️' };
const FALLBACK_EMOJI = ['🌟','🚀','🧩','🌈','🦄','🎨','🍄','🔢','🐻','🌳'];
const JOB_TEXT = { waiting:'Ждёт очереди', submitting:'Отправляю…', queued:'В очереди Higgsfield', generating:'Генерируется…' };
const HELPER = 'http://localhost:8787';

let helperOn = false;
let jobs = {};
let base = [];
let fileScenarios = [];
let custom = load('lk_custom', []);
let state = load('lk_state', {});      // id -> {status, shots, file}
let tab = load('lk_tab', 'proposed');
let selected = null;

function load(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function hash(t){ let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) | 0; return h; }
function emojiFor(s){ return s.emoji || EMOJI[s.id] || FALLBACK_EMOJI[Math.abs(hash(s.id)) % FALLBACK_EMOJI.length]; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function view(s){
  const o = state[s.id] || {};
  const status = s.status === 'done' ? 'done' : (o.status || s.status);
  return { ...s, status, file: o.file || s.file, shots: o.shots || s.shots };
}
function buildPrompt(s){
  const extra = s.extra ? ', ' + s.extra : '';
  const end = s.others ? CHAR_END.replace(' Only him.', '') : CHAR_END;
  const loc = s.others ? s.location + ' Also in the scene: ' + s.others + '.' : s.location;
  const lines = s.shots.map((x,i) => `${i*2}-${i*2+2}s: ${x.action}, says "${x.say}"`).join('\n');
  return [
    'Cute 3D Pixar-style toddler video, 10 seconds, bright colors, nursery style.',
    CHAR_START + extra + end,
    loc, s.intro, lines,
    `${s.rule} Slow cute clear movements. Soft child voice. Gentle kids music. No text on screen (except "LOOKLIE" on his clothes). Very simple and toddler-safe.`
  ].join('\n\n');
}
function setStatus(id, status){ state[id] = { ...(state[id]||{}), status }; save('lk_state', state); render(); }
function setShot(id, i, key, val){
  const s = view(base.find(b => b.id === id));
  const shots = s.shots.map(x => ({...x}));
  shots[i][key] = val;
  state[id] = { ...(state[id]||{}), shots };
  save('lk_state', state);
  const p = document.getElementById('promptBox');
  if (p) p.textContent = buildPrompt({ ...s, shots });
}
let toastTimer;
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2400); }
async function copy(text, msg){ try { await navigator.clipboard.writeText(text); toast(msg); } catch { prompt('Скопируйте вручную:', text); } }

function approvedCommand(){
  const items = base.map(view).filter(s => s.status === 'approved');
  const payload = items.map(s => ({ id: s.id, title: s.title, prompt: buildPrompt(s) }));
  return 'Сгенерируй видео по одобренным сценариям (Grok Imagine 1.5 Lite, 9:16, 720p, 10 сек, без референса), по очереди, готовые файлы клади в папку «YouTuBe UP!» на рабочем столе: '
    + items.map(s => s.id).join(', ') + '\n\n```json\n' + JSON.stringify(payload, null, 2) + '\n```';
}

async function generateVideos(){
  const items = base.map(view).filter(s => s.status === 'approved' && !(jobs[s.id] && !['failed','done'].includes(jobs[s.id].status)));
  if (!items.length){ toast('Нет одобренных сценариев без активной генерации'); return; }
  if (!helperOn){ copy(approvedCommand(), 'Помощник не запущен — команда скопирована, вставьте её Claude в чат'); return; }
  if (!confirm('Отправить на генерацию: ' + items.length + ' шт.? Это платная операция в Higgsfield API. Видео делаются по очереди.')) return;
  try {
    const r = await fetch(HELPER + '/generate', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ items: items.map(s => ({ id: s.id, title: s.title, prompt: buildPrompt(s) })) }) });
    const d = await r.json();
    toast('Отправлено в очередь: ' + (d.added || []).length);
    pollJobs();
  } catch { toast('Не удалось связаться с помощником'); }
}

async function pollJobs(){
  const pill = document.getElementById('helper'), txt = document.getElementById('helperText');
  try {
    const h = await (await fetch(HELPER + '/health')).json();
    helperOn = !!h.ok;
    pill.className = 'pill on'; txt.textContent = 'Помощник подключён · ' + h.outDir;
    const list = (await (await fetch(HELPER + '/jobs')).json()).jobs || [];
    jobs = {}; let changed = false;
    list.forEach(j => {
      jobs[j.id] = j;
      if (j.status === 'done' && !(state[j.id] && state[j.id].status === 'done')) { state[j.id] = { ...(state[j.id]||{}), status:'done', file:j.file }; changed = true; }
    });
    if (changed) save('lk_state', state);
  } catch {
    helperOn = false;
    pill.className = 'pill'; txt.textContent = 'Помощник не запущен — запустите start-server.bat';
  }
  render();
}

function addIdeas(){
  const fresh = generateIdeas(10, base.map(b => b.id));
  if (!fresh.length){ toast('Банк идей закончился — все темы уже добавлены'); return; }
  custom = custom.concat(fresh); save('lk_custom', custom);
  base = fileScenarios.concat(custom);
  tab = 'proposed'; save('lk_tab', tab); selected = fresh[0].id; render();
  toast('Добавлено идей: ' + fresh.length);
}

function itemStatus(s){
  const j = jobs[s.id];
  if (s.status === 'approved' && j) {
    if (j.status === 'failed') return ['Ошибка генерации', 'err'];
    return [JOB_TEXT[j.status] || j.status, 'busy'];
  }
  if (s.status === 'done') return ['Видео готово', 'good'];
  if (s.status === 'approved') return ['Одобрено', ''];
  return [s.shots.map(x => x.say).slice(0,4).join(' · '), ''];
}

function render(){
  const all = base.map(view);
  document.getElementById('tabs').innerHTML = TABS.map(([k,l]) =>
    `<button class="tab" role="tab" aria-selected="${tab===k}" data-tab="${k}">${l}<b>${all.filter(s=>s.status===k).length}</b></button>`).join('');
  document.getElementById('copyCmd').disabled = !all.some(s => s.status === 'approved');

  const items = all.filter(s => s.status === tab);
  if (!items.some(s => s.id === selected)) selected = items[0] ? items[0].id : null;
  document.getElementById('list').innerHTML = items.length ? items.map(s => {
    const [t, cls] = itemStatus(s);
    return `<button class="item" data-sel="${s.id}" aria-current="${s.id===selected}"><span class="em">${emojiFor(s)}</span><span class="tx"><div class="tt">${esc(s.title)}</div><div class="st ${cls}">${esc(t)}</div></span></button>`;
  }).join('') : `<div class="none">${tab === 'proposed' ? 'Новых сценариев нет.<br>Нажмите «Сгенерировать идеи».' : 'Здесь пока пусто.'}</div>`;

  const s = all.find(x => x.id === selected);
  const d = document.getElementById('detail');
  if (!s){ d.innerHTML = '<div class="empty">Выберите сценарий слева</div>'; return; }
  // не перерисовываем карточку, пока пользователь печатает в ней
  if (d.dataset.shown === s.id + '|' + s.status + '|' + (jobs[s.id] ? jobs[s.id].status : '') && d.contains(document.activeElement) && document.activeElement.tagName === 'INPUT') return;
  d.dataset.shown = s.id + '|' + s.status + '|' + (jobs[s.id] ? jobs[s.id].status : '');
  const editable = s.status === 'proposed' || s.status === 'approved';
  const shots = s.shots.map((x,i) => editable
    ? `<div class="shot"><span class="tm">${i*2}–${i*2+2} с</span><input type="text" value="${esc(x.action)}" aria-label="Действие, кадр ${i+1}" data-id="${s.id}" data-i="${i}" data-k="action"><input class="say" type="text" value="${esc(x.say)}" aria-label="Слово, кадр ${i+1}" data-id="${s.id}" data-i="${i}" data-k="say"></div>`
    : `<div class="shot"><span class="tm">${i*2}–${i*2+2} с</span><span class="ro">${esc(x.action)}</span><span class="ro say">${esc(x.say)}</span></div>`).join('');
  let btns = '';
  if (s.status === 'proposed') btns = `<button class="btn ok" data-act="approved" data-id="${s.id}">Одобрить</button><button class="btn bad" data-act="rejected" data-id="${s.id}">В корзину</button>`;
  if (s.status === 'approved') btns = `<button class="btn" data-act="proposed" data-id="${s.id}">Вернуть в новые</button>`;
  if (s.status === 'rejected') btns = `<button class="btn" data-act="proposed" data-id="${s.id}">Восстановить</button>`;
  const j = jobs[s.id];
  const note = s.status === 'done' ? `<div class="note">Файл: ${esc(s.file || '')}</div>`
    : (s.status === 'approved' && j && j.status === 'failed') ? `<div class="note err">${esc(j.error || '')}</div>` : '';
  d.innerHTML = `<div class="head"><span class="em">${emojiFor(s)}</span><h1>${esc(s.title)}</h1></div>
    <p class="sub">${esc(s.location)}</p>
    <div class="label">Кадры</div><div class="shots">${shots}</div>
    <div class="label">Промпт</div><div class="prompt" id="promptBox">${esc(buildPrompt(s))}</div>
    <div class="actions">${btns}<button class="btn ghost" data-copy="${s.id}">Копировать промпт</button></div>${note}`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.tab){ tab = t.dataset.tab; save('lk_tab', tab); selected = null; render(); }
  else if (t.dataset.sel){ selected = t.dataset.sel; render(); if (innerWidth <= 820) document.getElementById('detail').scrollIntoView(); }
  else if (t.dataset.act) setStatus(t.dataset.id, t.dataset.act);
  else if (t.dataset.copy) copy(buildPrompt(view(base.find(b => b.id === t.dataset.copy))), 'Промпт скопирован');
  else if (t.id === 'copyCmd') generateVideos();
  else if (t.id === 'askNew') addIdeas();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.k) setShot(t.dataset.id, +t.dataset.i, t.dataset.k, t.value);
});

fetch('scenarios.json?v=' + Date.now()).then(r => r.json()).then(d => {
  fileScenarios = d; base = fileScenarios.concat(custom); render(); pollJobs(); setInterval(pollJobs, 6000);
}).catch(() => { document.getElementById('detail').innerHTML = '<div class="empty">Не удалось загрузить scenarios.json<br>Откройте сайт через GitHub Pages или локальный сервер.</div>'; });
</script>
</body>
</html>
